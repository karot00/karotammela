{{define "stock-chart"}}
<div id="stock-chart-wrap" x-data="stockChart()" class="space-y-4">
  <form method="get" action="/{{.Locale}}/dashboard" x-on:submit.prevent>
    <input type="hidden" name="view" value="ai-pulse" />
    <label for="ticker-select" class="text-xs font-semibold text-muted-foreground">{{.AiPulseTickerLabel}}</label>
    <select id="ticker-select" name="ticker" @change="onChange($event)"
      onchange="this.form.requestSubmit ? this.form.requestSubmit() : this.form.submit()"
      class="mt-1 block w-full rounded-md border border-border bg-background px-2 py-1 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-ring sm:w-auto">
      {{range .StockTickers}}
        <option value="{{.Ticker}}" {{if eq $.StockInitialTicker .Ticker}}selected{{end}}>{{.Name}} ({{.Ticker}})</option>
      {{end}}
    </select>
  </form>

  <div x-ref="chart" id="stock-chart-canvas" class="mt-2 h-64 w-full" role="img"
    aria-label="{{.StockCompanyName}} {{.AiPulseStockChartAria}}"></div>

  <script id="stock-chart-data" type="application/json">{{.StockInitialDataJSON}}</script>

  <p id="stock-chart-empty" x-show="empty" class="py-3 text-center text-xs text-muted-foreground"{{if .StockInitialData}} style="display: none"{{end}}>{{.AiPulseNoStocksLabel}}</p>
</div>

<script src="/static/lightweight-charts.standalone.production.js"></script>
<script>
  function stockChart() {
    return {
      ticker: '{{.StockInitialTicker}}',
      chart: null,
      empty: {{if .StockInitialData}}false{{else}}true{{end}},
      init() {
        var self = this;
        var dataEl = document.getElementById('stock-chart-data');
        var initial = dataEl ? JSON.parse(dataEl.textContent) : [];
        self.renderChart(self.$refs.chart, initial);
        window.addEventListener('resize', function () {
          if (self.chart && self.$refs.chart) {
            self.chart.resize(self.$refs.chart.clientWidth, 256);
          }
        });
      },
      renderChart(container, rows) {
        if (typeof LightweightCharts === 'undefined' || !container) return;
        if (this.chart) { this.chart.remove(); this.chart = null; }
        var chart = LightweightCharts.createChart(container, {
          width: container.clientWidth,
          height: 256,
          layout: { background: { color: 'transparent' }, textColor: '#a1a1aa' },
          grid: {
            vertLines: { color: 'rgba(255,255,255,0.06)' },
            horzLines: { color: 'rgba(255,255,255,0.06)' }
          },
          rightPriceScale: { borderColor: 'rgba(255,255,255,0.1)' },
          timeScale: { borderColor: 'rgba(255,255,255,0.1)' },
          crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
        });
        var series = chart.addSeries(LightweightCharts.AreaSeries, {
          lineColor: '#00d2ff',
          topColor: 'rgba(0,210,255,0.2)',
          bottomColor: 'rgba(0,210,255,0)',
          lineWidth: 2,
          priceLineVisible: false
        });
        series.setData(rows.map(function (r) { return { time: r.date, value: r.close }; }));
        chart.timeScale().fitContent();
        this.chart = chart;
      },
      onChange(e) {
        var next = e.target.value;
        if (next === this.ticker) return;
        this.ticker = next;
        var self = this;
        fetch('/api/ai-pulse/stocks?ticker=' + encodeURIComponent(next))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (json) {
            if (!json) return;
            self.renderChart(self.$refs.chart, json.data);
            self.empty = !json.data || json.data.length === 0;
          })
          .catch(function () {});
      }
    };
  }
</script>
{{end}}
