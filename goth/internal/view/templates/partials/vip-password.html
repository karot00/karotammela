{{define "vip-password"}}
<section class="vip-auth-shell flex flex-1 items-center justify-center px-6 py-16" x-data="{ leaving: false }" :class="{ 'is-leaving': leaving }">
  <div class="w-full max-w-md rounded-2xl border border-border/60 bg-card/60 p-8 backdrop-blur-md">
    <p class="text-xs font-semibold uppercase tracking-[0.24em] text-primary">Restricted access</p>
    <h1 class="mt-4 text-2xl font-semibold text-foreground">Enter your password</h1>
    <p class="mt-3 text-sm leading-relaxed text-muted-foreground">
      Enter the password provided with your invitation to continue.
    </p>
    {{if .Error}}<p class="mt-3 text-sm text-rose-400" role="alert">{{.Error}}</p>{{end}}
    <form class="mt-6 space-y-4" hx-post="/api/vip/login" hx-target="#vip-root" hx-swap="innerHTML transition:true" hx-trigger="submit delay:420ms" hx-disabled-text="Checking..." @submit="leaving = true">
      <div>
        <label for="vip-code" class="text-xs font-medium uppercase tracking-wide text-muted-foreground">Password</label>
        <input id="vip-code" name="code" type="password" required maxlength="128" autocomplete="current-password"
               class="mt-1 w-full rounded-md border border-border/60 bg-background px-3 py-2 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/60" />
      </div>
      <button type="submit" class="w-full rounded-md bg-primary px-4 py-2 text-sm font-semibold text-primary-foreground transition hover:bg-primary/90">Enter</button>
    </form>
    <div class="mt-5 flex items-center justify-between gap-4 text-xs"><a href="/en/vip" class="text-muted-foreground transition hover:text-foreground">Back</a><a href="/" class="text-muted-foreground transition hover:text-foreground">Main page →</a></div>
  </div>
</section>
{{end}}
